# config/site_content.php e uma lista de textos (key, label, default) com o
# mesmo formato em todos os campos; nao e codigo copiado, entao fica fora da
# checagem de duplicacao. Bugs, seguranca e o resto continuam sendo analisados.
#
# O mesmo vale para as migrations "insere_*": elas so cadastram os dados
# iniciais (editais, projetos, documentos, diretoria...), em listas com o
# mesmo formato.
sonar.cpd.exclusions=config/site_content.php,database/migrations/*_insere_*.php
