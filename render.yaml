# Blueprint do Render: cria o site + o banco PostgreSQL de uma vez.
# No Render: New + > Blueprint > escolha este repositório.
services:
  - type: web
    name: site-institucional
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: IDTNPR
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true   # gerada pelo Render; o start.sh ajusta o formato
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: site-institucional-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: ADMIN_EMAIL
        value: admin@idtnpr.org.br
      - key: ADMIN_PASSWORD
        sync: false   # o Render pede para você digitar a senha do painel

databases:
  - name: site-institucional-db
    plan: free
